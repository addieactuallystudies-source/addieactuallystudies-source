name: Enchanted Garden

on:
  schedule:
    - cron: "30 18 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  grow-garden:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Grow the garden
        env:
          GITHUB_TOKEN: ${{ secrets.GARDEN_TOKEN }}
        run: python scripts/generate_garden.py

      - name: Save garden changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/garden.svg

          if git diff --cached --quiet; then
            echo "No garden changes today."
          else
            git commit -m "🌱 The enchanted garden grows"
            git push
          fi